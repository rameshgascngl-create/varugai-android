name: VARUGAI 16 Native Phase Gate

on:
  workflow_dispatch:
  push:
    branches: [ release/varugai-native-v16 ]

permissions:
  contents: read

jobs:
  phase-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create Gradle 8.13 wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Native architecture audit
        run: ./tools/audit-native-architecture.sh

      - name: Phase 2 roster source audit
        run: ./tools/audit-phase2-roster.sh

      - name: Phase 3 grid source audit
        run: ./tools/audit-phase3-grid.sh

      - name: Phase 4 summary source audit
        run: ./tools/audit-phase4-summary.sh

      - name: Phase 5 export/backup source audit
        run: ./tools/audit-phase5-export.sh

      - name: Native UX hardening audit
        run: ./tools/audit-native-ux-hardening.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Compile Phase-5 native debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK has no legacy renderer
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | tee apk-file-list.txt
          ! grep -Ei 'assets/.*\.(html|js|css)$' apk-file-list.txt
          ! grep -Ei 'assets/(index\.html|app\.js|styles\.css)' apk-file-list.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VARUGAI-16.0.0-phase5-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            apk-file-list.txt
            PHASE1_NATIVE_IMPLEMENTATION_REPORT.md
            PHASE2_NATIVE_IMPLEMENTATION_REPORT.md
            PHASE3_NATIVE_IMPLEMENTATION_REPORT.md
            PHASE4_NATIVE_IMPLEMENTATION_REPORT.md
            PHASE5_NATIVE_IMPLEMENTATION_REPORT.md
            DEVICE_QA_NATIVE_V16.md
