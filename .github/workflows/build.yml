name: VARUGAI 16 Native Phase Gate

on:
  workflow_dispatch:
  push:
    branches: [ release/varugai-native-v16, audit/v16-parity-hardening, audit/v16-encrypted-backup-recovery-key ]

permissions:
  contents: read

concurrency:
  group: varugai-native-phase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create Gradle 8.13 wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Native architecture audit
        run: ./tools/audit-native-architecture.sh

      - name: Phase 2 roster source audit
        run: ./tools/audit-phase2-roster.sh

      - name: Phase 3 grid source audit
        run: ./tools/audit-phase3-grid.sh

      - name: Phase 4 summary source audit
        run: ./tools/audit-phase4-summary.sh

      - name: Phase 5 export/backup source audit
        run: ./tools/audit-phase5-export.sh

      - name: Native UX hardening audit
        run: ./tools/audit-native-ux-hardening.sh

      - name: Required corrections source audit
        run: ./tools/audit-required-corrections.sh

      - name: Golden v15 to v16 migration parity
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.gasczoology.varugai.data.backup.LegacyMigrationGoldenTest'

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug lintRelease

      - name: Compile native debug and unsigned release audit APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Audit release variant
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | tee release-apk-file-list.txt
          grep -q 'libsqlcipher.so' release-apk-file-list.txt

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | tee release-manifest.txt
          ! grep -q 'android:debuggable(0x0101000f)=(type 0x12)0xffffffff' release-manifest.txt
          ! grep -q 'androidx.compose.ui.tooling.PreviewActivity' release-manifest.txt
          ! grep -q 'androidx.activity.ComponentActivity' release-manifest.txt

          : > release-dex-strings.txt
          while read -r dex; do
            unzip -p "$APK" "$dex" | strings >> release-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]*)?\.dex$')
          ! grep -Fq 'com/gasczoology/varugai/data/repository/VarugaiRepository' release-dex-strings.txt
          ! grep -Fq 'data/repository/VarugaiRepository' release-dex-strings.txt
          ! grep -Eq 'NotificationManagerCompat|android/app/AlarmManager|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|RECEIVE_BOOT_COMPLETED' release-dex-strings.txt

      - name: Verify debug APK has no legacy renderer
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | tee apk-file-list.txt
          ! grep -Ei 'assets/.*\.(html|js|css)$' apk-file-list.txt
          ! grep -Ei 'assets/(index\.html|app\.js|styles\.css)' apk-file-list.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VARUGAI-16.0.0-phase5-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            apk-file-list.txt
            release-apk-file-list.txt
            release-manifest.txt
            release-dex-strings.txt
            PHASE1_NATIVE_IMPLEMENTATION_REPORT.md
            PHASE2_NATIVE_IMPLEMENTATION_REPORT.md
            PHASE3_NATIVE_IMPLEMENTATION_REPORT.md
            PHASE4_NATIVE_IMPLEMENTATION_REPORT.md
            PHASE5_NATIVE_IMPLEMENTATION_REPORT.md
            DEVICE_QA_NATIVE_V16.md
