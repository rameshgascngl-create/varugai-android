name: VARUGAI Native Production Release — LOCKED

# Production release stays manual and must not be used until all native phases,
# legacy restore, signing verification and physical-device QA are complete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked:
    runs-on: ubuntu-latest
    steps:
      - name: Release gate intentionally locked during native migration
        run: |
          echo "VARUGAI 16 production release is locked."
          echo "Complete Phases 3–5, legacy import tests, release signing and device QA before enabling this workflow."
          exit 1
