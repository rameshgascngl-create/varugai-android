# and physical-device QA are complete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked:
    runs-on: ubuntu-latest
    steps:
      - name: Release gate intentionally locked
        run: |
          echo "VARUGAI 16 production release is locked."
          echo "All native phases must have a green CI gate, then production signing and physical-device QA must pass before this workflow is enabled."
          exit 1
