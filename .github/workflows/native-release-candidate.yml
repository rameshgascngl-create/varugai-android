name: VARUGAI 16 Native Release Candidate
# Trigger signed VARUGAI 16.0.2 release-engineering candidate

on:
  push:
    branches: [ release/varugai-native-v16 ]
    paths:
      - '.github/workflows/native-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run native architecture and required-corrections audits
        run: |
          ./tools/audit-native-architecture.sh
          ./tools/audit-phase2-roster.sh
          ./tools/audit-phase3-grid.sh
          ./tools/audit-phase4-summary.sh
          ./tools/audit-phase5-export.sh
          ./tools/audit-native-ux-hardening.sh
          ./tools/audit-required-corrections.sh

      - name: Golden v15 to v16 migration parity
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.gasczoology.varugai.data.backup.LegacyMigrationGoldenTest'

      - name: Release-blocking JVM cases A-J
        run: |
          ./gradlew --no-daemon testDebugUnitTest \
            --tests 'com.gasczoology.varugai.domain.attendance.ReleaseBlockingAttendanceCasesTest' \
            --tests 'com.gasczoology.varugai.data.backup.ReleaseBlockingBackupCaseJTest'

      - name: Unit tests and lint
        run: |
          ./gradlew --no-daemon testDebugUnitTest
          ./gradlew --no-daemon lintDebug lintRelease
          ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Require production signing secrets
        env:
          KS: ${{ secrets.VARUGAI_KEYSTORE_BASE64 }}
          KSPW: ${{ secrets.VARUGAI_KEYSTORE_PASSWORD }}
          KSA: ${{ secrets.VARUGAI_KEY_ALIAS }}
          KSPASS: ${{ secrets.VARUGAI_KEY_PASSWORD }}
        run: |
          test -n "$KS"
          test -n "$KSPW"
          test -n "$KSA"
          test -n "$KSPASS"

      - name: Decode and verify release keystore
        env:
          VARUGAI_KEYSTORE_BASE64: ${{ secrets.VARUGAI_KEYSTORE_BASE64 }}
          VARUGAI_KEYSTORE_PASSWORD: ${{ secrets.VARUGAI_KEYSTORE_PASSWORD }}
          VARUGAI_KEY_ALIAS: ${{ secrets.VARUGAI_KEY_ALIAS }}
        run: |
          echo "$VARUGAI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/varugai-release.jks"
          echo "VARUGAI_KEYSTORE_PATH=$RUNNER_TEMP/varugai-release.jks" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/varugai-release.jks"             -storepass "$VARUGAI_KEYSTORE_PASSWORD" -alias "$VARUGAI_KEY_ALIAS"             | tee keystore-cert.txt
          EXPECTED=A41E9DE248E95594868AE5740A492D35D35950AF644CD7EF190C731649826B9B
          ACTUAL=$(grep 'SHA256:' keystore-cert.txt | head -1 | sed 's/.*SHA256: *//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          echo "Expected signer: $EXPECTED"
          echo "Actual signer:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build signed native APK and AAB
        env:
          VARUGAI_KEYSTORE_PASSWORD: ${{ secrets.VARUGAI_KEYSTORE_PASSWORD }}
          VARUGAI_KEY_ALIAS: ${{ secrets.VARUGAI_KEY_ALIAS }}
          VARUGAI_KEY_PASSWORD: ${{ secrets.VARUGAI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Verify split APKs, AAB, architecture and signature
        run: |
          set -euo pipefail
          mkdir -p out
          V=$(grep -oP 'versionName = "\\K[^"]+' app/build.gradle.kts)
          ARM64=$(find app/build/outputs/apk/release -name '*arm64-v8a*release*.apk' | head -1)
          ARMV7=$(find app/build/outputs/apk/release -name '*armeabi-v7a*release*.apk' | head -1)
          UNIVERSAL=$(find app/build/outputs/apk/release -name '*universal*release*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$ARM64"
          test -n "$ARMV7"
          test -n "$UNIVERSAL"
          test -n "$AAB"

          cp "$ARM64" "out/VARUGAI-$V-arm64-v8a-release.apk"
          cp "$ARMV7" "out/VARUGAI-$V-armeabi-v7a-release.apk"
          cp "$UNIVERSAL" "out/VARUGAI-$V-universal-release.apk"
          cp "$AAB" "out/VARUGAI-$V-release.aab"
          echo "VER=$V" >> "$GITHUB_ENV"

          for APK in out/VARUGAI-$V-*-release.apk; do
            unzip -l "$APK" > "out/$(basename "$APK").files.txt"
            ! grep -Ei 'assets/.*\.(html|js|css)$' "out/$(basename "$APK").files.txt"
            grep -q 'libsqlcipher.so' "out/$(basename "$APK").files.txt"
          done

          unzip -Z1 "out/VARUGAI-$V-arm64-v8a-release.apk" | grep -q '^lib/arm64-v8a/libsqlcipher.so$'
          ! unzip -Z1 "out/VARUGAI-$V-arm64-v8a-release.apk" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'
          unzip -Z1 "out/VARUGAI-$V-armeabi-v7a-release.apk" | grep -q '^lib/armeabi-v7a/libsqlcipher.so$'
          ! unzip -Z1 "out/VARUGAI-$V-armeabi-v7a-release.apk" | grep -Eq '^lib/(arm64-v8a|x86|x86_64)/'
          unzip -Z1 "out/VARUGAI-$V-universal-release.apk" | grep -q '^lib/arm64-v8a/libsqlcipher.so$'
          unzip -Z1 "out/VARUGAI-$V-universal-release.apk" | grep -q '^lib/armeabi-v7a/libsqlcipher.so$'
          ! unzip -Z1 "out/VARUGAI-$V-universal-release.apk" | grep -Eq '^lib/(x86|x86_64)/'

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump xmltree "out/VARUGAI-$V-universal-release.apk" AndroidManifest.xml | tee out/release-manifest.txt
          ! grep -q 'android:debuggable(0x0101000f)=(type 0x12)0xffffffff' out/release-manifest.txt
          ! grep -q 'android.permission.INTERNET' out/release-manifest.txt
          ! grep -q 'androidx.compose.ui.tooling.PreviewActivity' out/release-manifest.txt
          ! grep -q 'androidx.activity.ComponentActivity' out/release-manifest.txt

          : > out/release-dex-strings.txt
          while read -r dex; do
            unzip -p "out/VARUGAI-$V-universal-release.apk" "$dex" | strings >> out/release-dex-strings.txt
          done < <(unzip -Z1 "out/VARUGAI-$V-universal-release.apk" | grep -E '^classes([0-9]*)?\.dex$')
          ! grep -Fq 'com/gasczoology/varugai/data/repository/VarugaiRepository' out/release-dex-strings.txt
          ! grep -Fq 'data/repository/VarugaiRepository' out/release-dex-strings.txt

          EXPECTED=A41E9DE248E95594868AE5740A492D35D35950AF644CD7EF190C731649826B9B
          for APK in out/VARUGAI-$V-*-release.apk; do
            NAME=$(basename "$APK" .apk)
            "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "out/apksigner-$NAME.txt"
            ACTUAL=$(grep -E 'Signer.*certificate SHA-256 digest:' "out/apksigner-$NAME.txt" | head -1 | awk -F': ' '{print $NF}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test -n "$ACTUAL"
            test "$ACTUAL" = "$EXPECTED"
          done

          curl -L --fail --retry 3 -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="out/VARUGAI-$V-release.aab" | tee out/bundletool-validate.txt

          {
            for F in out/*.apk out/*.aab; do
              printf '%s\t%s bytes\n' "$(basename "$F")" "$(stat -c '%s' "$F")"
            done
          } | tee out/SIZES.txt

      - name: Checksums
        run: |
          cd out
          sha256sum *.apk *.aab | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VARUGAI-${{ env.VER }}-native-release-candidate
          path: |
            out/VARUGAI-*.apk
            out/VARUGAI-*.aab
            out/SHA256SUMS.txt
            out/apksigner-*.txt
            out/*.files.txt
            out/bundletool-validate.txt
            out/SIZES.txt
            out/release-manifest.txt
            out/release-dex-strings.txt
            keystore-cert.txt
            DEVICE_QA_NATIVE_V16.md
            app/schemas/**
